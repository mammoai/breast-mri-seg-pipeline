services:
  db:
    image: postgres:12
    environment:
      POSTGRES_DB: ${POSTGRE_NAME}
      POSTGRES_USER: ${POSTGRE_USER}
      POSTGRES_PASSWORD: ${POSTGRE_PASSWORD}
    volumes:
      - ${ROOTFOLDER}/label-studio/pgdata:/var/lib/postgresql/data
    restart: always

  label-studio-app:
    image: heartexlabs/label-studio:1.14.0
    depends_on:
      - db
    volumes:
      - ${ROOTFOLDER}/label-studio/data:/label-studio/data
      - ${ROOTFOLDER}/label-studio/images:/label-studio/images
    environment:
      - LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED=true
      - LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT=/label-studio/images

      # Pick a host port you actually use in the browser
      - HOST=http://localhost:9090
      - LABEL_STUDIO_HOST=http://localhost:9090
      - CSRF_TRUSTED_ORIGINS=http://localhost:9090

      # Postgres connection (service name = db)
      - DJANGO_DB=default
      - POSTGRE_NAME=${POSTGRE_NAME}
      - POSTGRE_USER=${POSTGRE_USER}
      - POSTGRE_PASSWORD=${POSTGRE_PASSWORD}
      - POSTGRE_PORT=5432
      - POSTGRE_HOST=db

      # Allow open signup (make sure you do NOT set the “disable signup without link” flag)
      - LABEL_STUDIO_DISABLE_SIGNUP_WITHOUT_LINK=false

    restart: always
    ports:
      - "9090:8080"